<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f8a">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; frame-src https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self';">
  <title>SIOE EPOANT</title>

  <style>
    :root {
      color-scheme: light;
      --sioe-bg: #eef4f8;
      --sioe-primary: #0b4f8a;
      --sioe-text: #17324d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--sioe-bg);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
    }

    #sioe-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      overflow: hidden;
      background: var(--sioe-bg);
    }

    #sioe-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #fff;
    }

    #loader {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(238,244,248,.98), rgba(255,255,255,.98));
      transition: opacity .25s ease, visibility .25s ease;
    }

    #loader.oculto {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: min(88vw, 360px);
      padding: 26px 24px;
      text-align: center;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(20, 53, 82, .14);
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 16px;
      border: 4px solid #d9e6f0;
      border-top-color: var(--sioe-primary);
      border-radius: 50%;
      animation: giro .8s linear infinite;
    }

    .loader-card strong {
      display: block;
      margin-bottom: 7px;
      color: var(--sioe-text);
      font-size: 18px;
    }

    .loader-card span {
      color: #607487;
      font-size: 14px;
      line-height: 1.4;
    }

    @keyframes giro {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 1.8s;
      }
    }
  </style>
</head>

<body>
  <main id="sioe-shell" aria-label="Sistema Integral de Orientación Educativa">
    <div id="loader" role="status" aria-live="polite">
      <div class="loader-card">
        <div class="spinner" aria-hidden="true"></div>
        <strong>SIOE EPOANT</strong>
        <span>Cargando el Sistema Integral de Orientación Educativa…</span>
      </div>
    </div>

    <iframe
      id="sioe-frame"
      src="https://script.google.com/macros/s/AKfycbwyejYjRrIqUviy0T1jRI7BWxBiQM_cYxGPqKJYGSrQgR2AXqmYun9fuOiZzEl7f04/exec"
      title="SIOE EPOANT"
      allow="clipboard-read; clipboard-write"
      allowfullscreen
    ></iframe>
  </main>

  <script>
    (function () {
      const frame = document.getElementById('sioe-frame');
      const loader = document.getElementById('loader');

      function ocultarLoader() {
        if (loader) loader.classList.add('oculto');
      }

      frame.addEventListener('load', function () {
        window.setTimeout(ocultarLoader, 350);
      });

      // Respaldo visual por si el evento load tarda demasiado.
      window.setTimeout(ocultarLoader, 12000);
    })();
  </script>
</body>
</html>
