<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Firma de reporte académico · SIOE EPOANT</title>
  <style>
    html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#eef3f7;font-family:Arial,Helvetica,sans-serif}
    #sioeFirmaFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#eef3f7}
    #estado{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:#eef3f7;color:#173f62}
    .card{width:min(480px,100%);background:#fff;border:1px solid #d8e3ea;border-radius:18px;box-shadow:0 14px 38px rgba(20,50,70,.12);padding:28px;text-align:center}
    .marca{width:58px;height:58px;margin:0 auto 14px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#155594;color:#fff;font-size:27px;font-weight:900}
    h1{margin:0;font-size:23px}p{margin:10px 0 0;color:#637684;line-height:1.45;font-size:14px}.error{color:#9f2929}
  </style>
</head>
<body>
  <div id="estado"><div class="card"><div class="marca">S</div><h1 id="estadoTitulo">Abriendo reporte académico</h1><p id="estadoTexto">Espere un momento…</p></div></div>
  <iframe id="sioeFirmaFrame" title="Firma de reporte académico" allow="clipboard-write" referrerpolicy="no-referrer"></iframe>
  <script>
  (function(){
    'use strict';
    /* PASO OBLIGATORIO: insertar la URL /exec de la MISMA implementación
       que utiliza el panel SIOE. No incluir ?firmaCal ni otro parámetro. */
    const SIOE_EXEC_URL = 'https://script.google.com/macros/s/AKfycbwyejYjRrIqUviy0T1jRI7BWxBiQM_cYxGPqKJYGSrQgR2AXqmYun9fuOiZzEl7f04/exec';
    const qs = new URLSearchParams(window.location.search);
    const bruto = String(qs.get('token') || '').trim();
    // La firma usa exactamente 64 caracteres hex; texto añadido al enlace
    // (por ejemplo, al copiar WhatsApp) no se envía a Apps Script.
    const m = bruto.match(/^([0-9a-f]{64})/i);
    const token = m ? m[1].toLowerCase() : '';
    const titulo = document.getElementById('estadoTitulo');
    const texto = document.getElementById('estadoTexto');
    const estado = document.getElementById('estado');
    const frame = document.getElementById('sioeFirmaFrame');
    const exec = String(SIOE_EXEC_URL).trim().match(/https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/i);
    function error(mensaje){titulo.textContent='No fue posible abrir la firma';texto.textContent=mensaje;texto.className='error'}
    if (!token) {error('El enlace de firma está incompleto. Solicite uno nuevo.');return}
    if (!exec) {error('Falta configurar la URL vigente de Apps Script en firma.html.');return}
    const destino=exec[0]+'?firmaCal='+encodeURIComponent(token);
    frame.addEventListener('load',function(){estado.style.display='none';frame.style.display='block'}, {once:true});
    frame.src=destino;
  })();
  </script>
</body>
</html>
